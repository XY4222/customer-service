name: 推荐理由生成
description: 为每件已选商品生成卖点文案，突出与用户需求的匹配点。
version: 1.0.0
model: doubao-seed-2-0-mini-260215
temperature: 0.7
maxTokens: 800
input_schema:
  type: object
  required: [requirement, products]
  properties:
    requirement: { type: object }
    products: { type: array }
output_schema:
  type: object
  required: [reasons]
  properties:
    reasons:
      type: array
      items:
        type: object
        required: [productId, highlight]
        properties:
          productId: { type: string }
          highlight: { type: string }
